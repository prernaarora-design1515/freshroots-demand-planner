# One-time helper: unpacks freshroots-project.zip (uploaded through the GitHub web UI) into the repo.
# After the first run it does nothing; you can delete this file.
name: Unpack project
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          if [ ! -f freshroots-project.zip ]; then echo "Nothing to unpack"; exit 0; fi
          unzip -o freshroots-project.zip -d .
          rm freshroots-project.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Freshroots demand planner source"
          git push
