# Unpacks freshroots-project.zip (uploaded through the GitHub web UI) into the repo, mirroring it:
# files missing from the zip are deleted too. Does nothing when no zip is present.
name: Unpack project
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack, mirror and commit
        run: |
          if [ ! -f freshroots-project.zip ]; then echo "Nothing to unpack"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q freshroots-project.zip -d "$RUNNER_TEMP/src"
          rm freshroots-project.zip
          rsync -a --delete --exclude '.git/' --exclude '.github/' "$RUNNER_TEMP/src/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Freshroots demand planner source"
          git push
